<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>

        <link rel="stylesheet" href="styles.css"/>

    </head>
    <body>
    
        <audio id="music-player" src="" type="audio/mp3" autoplay></audio>
        <video id="bg-video" autoplay loop muted>
        </video>
        <img src="assets/whisp_top1.png" class="whisp" id="whisp-top1"/>
        <img src="assets/whisp_top2.png" class="whisp" id="whisp-top2"/>
        <img src="assets/whisp_bottom.png" class="whisp"/>
        <h1 class="loading-title">loading</h1>
        <h1 class="loading-title under">loading</h1>
        <h1 class="loading-title under2">loading</h1>
        <div id="fader"></div>

        <div id="loading-bar">
            <div id="gradient-bottom"></div>
            <div style="margin-top:auto; margin-bottom:auto;"></div>
            <span class="mac-span mac-block" id="modeName">Mode: Sandbox</span>
            <span class="mac-span mac-block" id="mapName">Map: gm_construct</span>
            <div id="fake-window-controls">
                <img id="mac-buttons" src="assets/mac_buttons.png"/>
                <div id="window-controls-center">
                    <img id="gmod-logo" src="assets/gmod_logo.png"/>
                    <span class="mac-span" id="serverName">Garry's Awesome Server</span>
                </div>
            </div>
        </div>
    </body>
    <script src="script.js"></script>
</html>
